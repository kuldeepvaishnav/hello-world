# =============================================================================
# Check Processor — configuration
# =============================================================================
# Copy this file to config.properties (remove the .example suffix) and fill
# in your values before running the application.
#
# To find a Google Drive folder ID:
#   1. Open the folder in drive.google.com
#   2. Copy the ID from the URL:
#      https://drive.google.com/drive/folders/<FOLDER_ID_IS_HERE>
# =============================================================================

# --- Google Drive ---------------------------------------------------------

# Folder to watch for incoming check images (JPEG, PNG, TIFF, PDF, etc.)
drive.input.folder.id=YOUR_INPUT_FOLDER_ID_HERE

# Parent folder under which dated output folders are auto-created.
# Output folders are named:  ddMMM_Deposites  (e.g. 10Apr_Deposites)
drive.output.parent.folder.id=YOUR_OUTPUT_PARENT_FOLDER_ID_HERE

# How often to poll the input folder for new files (seconds)
drive.poll.interval.seconds=30

# --- Email ----------------------------------------------------------------

# Recipient for processed-check notification emails
email.recipient=kvaishnav@gmail.com

# --- Google OAuth ---------------------------------------------------------

# Path to the credentials JSON downloaded from Google Cloud Console
# (APIs & Services → Credentials → OAuth 2.0 Client IDs → Download JSON)
google.credentials.path=credentials.json

# Directory where the OAuth token is cached after the first browser login.
# This directory is created automatically; do NOT commit it to source control.
google.tokens.directory=tokens

# --- State ----------------------------------------------------------------

# File used to track which Drive file IDs have already been processed.
# Prevents re-processing files after a restart.
processed.files.store=processed_files.txt
